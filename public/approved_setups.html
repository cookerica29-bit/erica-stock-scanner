<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairos Approved Setups</title>
  <style>
    :root {
      --bg: #080d14;
      --surface: #0d1520;
      --surface2: #121d2b;
      --surface3: #172437;
      --border: rgba(142, 163, 185, 0.22);
      --text: #e8eef6;
      --muted: #8ea0b5;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --pass: #22c55e;
      --fail: #fb7185;
      --warn: #f59e0b;
      --shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    a, button { color: inherit; font: inherit; }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; max-width: 780px; margin: 0 auto; padding: 0 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 18px 0 6px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    header h1 { font-size: 1.15rem; margin: 0; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .nav-link, button {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; min-height: 38px; padding: 0 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; white-space: nowrap; font-size: 0.85rem;
    }
    .nav-link:hover, button:hover { border-color: rgba(56, 189, 248, 0.55); background: var(--surface3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }

    .kairos-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
    .kairos-nav .nav-link.active { border-color: var(--accent); color: var(--accent); background: var(--surface3); font-weight: 600; }

    .api-band {
      display: flex; gap: 10px; align-items: center; padding: 10px 0; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .api-band input {
      flex: 1 1 220px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 10px; min-height: 38px;
    }
    .api-band.hidden { display: none; }

    main { flex: 1; padding-bottom: 40px; }

    .status-line { color: var(--muted); font-size: 0.9rem; margin: 20px 0; }
    .status-line.error { color: var(--fail); }
    .status-line a { color: var(--accent); }

    .auth-required-panel {
      text-align: center; background: var(--surface); border: 1px solid var(--warn);
      border-radius: 14px; padding: 40px 24px; margin-top: 24px;
    }
    .auth-required-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .auth-required-panel h2 { margin: 0 0 10px; color: var(--warn); }
    .auth-required-panel p { color: var(--text); margin: 6px 0; max-width: 440px; margin-left: auto; margin-right: auto; }
    .auth-required-panel .auth-required-hint { color: var(--muted); font-size: 0.85rem; }
    .auth-required-panel button { margin-top: 14px; }

    .disclaimer {
      font-size: 0.78rem; color: var(--muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px;
    }
    .progress-row { margin-bottom: 16px; }
    .progress-count { font-size: 0.9rem; color: var(--muted); }

    .setup-list { display: flex; flex-direction: column; gap: 16px; }

    .setup-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; box-shadow: 0 10px 30px var(--shadow);
    }
    .setup-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .setup-ticker { font-size: 1.6rem; font-weight: 700; }
    .setup-rank { color: var(--muted); font-size: 0.85rem; }
    .direction-pill {
      display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); margin-left: 8px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .state-pill {
      display: inline-block; margin-left: 8px; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.03em;
    }
    .state-WAITING_FOR_ENTRY { color: var(--muted); }
    .state-EXTENDED { color: var(--warn); border-color: rgba(245, 158, 11, 0.4); }
    .state-INVALIDATED { color: var(--fail); border-color: rgba(251, 113, 133, 0.4); }

    .current-price-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; margin: 12px 0 14px;
    }
    .current-price-label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .current-price-value { font-size: 1.3rem; font-weight: 700; }

    .metric-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px; margin: 12px 0;
    }
    .metric { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .metric-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .metric-value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .primary-metrics .metric { border-color: rgba(56, 189, 248, 0.3); }

    .state-notice {
      margin: 10px 0; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
    }
    .notice-extended { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.35); color: var(--warn); }
    .notice-invalidated { background: rgba(251, 113, 133, 0.08); border: 1px solid rgba(251, 113, 133, 0.35); color: var(--fail); }

    .review-context { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .review-meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .review-note {
      font-size: 0.85rem; margin-bottom: 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    }

    .signal-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px; margin: 8px 0 0;
    }
    .signal-row {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 0.82rem; display: flex; justify-content: space-between; gap: 8px;
    }
    .signal-row .read { font-weight: 600; }

    .card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  </style>
</head>
<body data-decision="approve">
  <div class="page-shell">
    <header>
      <div>
        <h1>Kairos Approved Setups</h1>
        <div class="subtitle">Trader-facing board &mdash; only human-approved setups for their current setup generation.</div>
      </div>
    </header>
    <nav class="kairos-nav" aria-label="Kairos navigation">
      <a class="nav-link" href="/candidates">Candidates Dashboard</a>
      <a class="nav-link" href="/review-queue">Review Queue</a>
      <a class="nav-link active" href="/approved-setups" aria-current="page">Approved Setups</a>
      <a class="nav-link" href="/watch-setups">Watch Setups</a>
    </nav>

    <div class="api-band" id="apiBand">
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Paste X-API-Key" />
      <button type="button" onclick="submitApiKey()">Connect</button>
    </div>

    <main id="mainContent">
      <div class="status-line" id="statusLine">Loading approved setups&hellip;</div>
    </main>
  </div>

  <script src="/static/setup_board.js?v=20260901-boards-selfinit"></script>
</body>
</html>
