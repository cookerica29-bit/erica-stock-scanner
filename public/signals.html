<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairos Signals</title>
  <style>
    :root {
      --bg: #080d14;
      --surface: #0d1520;
      --surface2: #121d2b;
      --surface3: #172437;
      --border: rgba(142, 163, 185, 0.22);
      --text: #e8eef6;
      --muted: #8ea0b5;
      --accent: #38bdf8;
      --fail: #fb7185;
      --warn: #f59e0b;
      /* Same simple palette family as the main Kairos dashboard, but only
         the handful of colors this minimal view actually needs -- a
         status BADGE color per simple label, never a full-row tint
         except the one required exception below. */
      --status-gray: rgba(142, 163, 185, 0.14);
      --status-gray-text: var(--muted);
      --status-blue: rgba(56, 189, 248, 0.16);
      --status-blue-text: #7dd3fc;
      --status-orange: rgba(251, 146, 60, 0.20);
      --status-orange-text: #fb923c;
      --status-purple: rgba(168, 85, 247, 0.18);
      --status-purple-text: #c084fc;
      --status-red: rgba(251, 113, 133, 0.16);
      --status-red-text: #fb7185;
      /* Entry Ready: the one and only full-row solid treatment on this
         page -- loud and unmistakable, same visual language as the main
         dashboard's ENTRY_READY row. */
      --status-green: #16a34a;
      --status-green-hover: #1bbf57;
      --status-green-text: #04170a;
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    a, button { color: inherit; font: inherit; }
    .page-shell { min-height: 100vh; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; padding: 0 16px; }

    header { padding: 18px 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.15rem; margin: 0; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

    .nav-link, button {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; min-height: 38px; padding: 0 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; white-space: nowrap; font-size: 0.85rem;
    }
    .nav-link:hover, button:hover { border-color: rgba(56, 189, 248, 0.55); background: var(--surface3); }

    .api-band {
      display: flex; gap: 10px; align-items: center; padding: 10px 0; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .api-band input {
      flex: 1 1 220px; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 10px; min-height: 38px;
    }
    .api-band.hidden { display: none; }

    .freshness-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 0.78rem; color: var(--muted); padding: 6px 10px; margin: 12px 0 10px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    }
    .freshness-bar .freshness-refresh-btn { font-size: 0.76rem; padding: 3px 10px; min-height: unset; }
    .freshness-bar.stale { border-color: rgba(245,158,11,0.4); color: var(--warn); }

    main { flex: 1; padding-bottom: 40px; }
    .status-line { color: var(--muted); font-size: 0.9rem; margin: 20px 0; }
    .status-line.error { color: var(--fail); }
    .progress-row { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }

    .auth-required-panel {
      text-align: center; background: var(--surface); border: 1px solid var(--warn);
      border-radius: 14px; padding: 40px 24px; margin-top: 24px;
    }
    .auth-required-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .auth-required-panel h2 { margin: 0 0 10px; color: var(--warn); }
    .auth-required-panel p { color: var(--text); margin: 6px 0; max-width: 440px; margin-left: auto; margin-right: auto; }
    .auth-required-panel .auth-required-hint { color: var(--muted); font-size: 0.85rem; }
    .auth-required-panel button { margin-top: 14px; }

    /* Same compact dark spreadsheet table language as the main dashboard,
       just four columns wide. */
    .dash-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table.dash-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .dash-table thead th {
      text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border);
      color: var(--muted); font-weight: 600; text-transform: uppercase;
      font-size: 0.7rem; letter-spacing: 0.04em; background: var(--surface);
      white-space: nowrap; position: sticky; top: 0;
    }
    .dash-table tbody td {
      padding: 5px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; line-height: 1.3;
    }
    .dash-table tbody tr.setup-row { cursor: pointer; background: var(--surface); }
    .dash-table tbody tr.setup-row:not(.row-accent-green):hover td { background: var(--surface3); }

    .ticker-cell { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
    .chevron { display: inline-block; width: 10px; color: var(--muted); font-size: 0.7rem; }
    .chevron::before { content: '\25B8'; }
    .setup-row.expanded .chevron::before { content: '\25BE'; }
    .setup-row.row-accent-green .chevron { color: var(--status-green-text); }

    .trade-pill {
      display: inline-block; font-size: 0.76rem; padding: 2px 9px; border-radius: 999px;
      border: 1px solid var(--border); font-weight: 700; letter-spacing: 0.03em;
    }
    .row-accent-green .trade-pill { border-color: var(--status-green-text); color: var(--status-green-text); }

    .status-pill {
      display: inline-block; font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; font-weight: 600;
    }
    .status-pill.status-gray { background: var(--status-gray); color: var(--status-gray-text); }
    .status-pill.status-blue { background: var(--status-blue); color: var(--status-blue-text); }
    .status-pill.status-orange { background: var(--status-orange); color: var(--status-orange-text); }
    .status-pill.status-purple { background: var(--status-purple); color: var(--status-purple-text); }
    .status-pill.status-red { background: var(--status-red); color: var(--status-red-text); }
    .status-pill.status-green { background: var(--status-green-text); color: var(--status-green); }

    /* The ONE full-row treatment on this page -- Entry Ready, and only
       Entry Ready. Loud on purpose, matching the main dashboard exactly. */
    tr.row-accent-green td {
      background: var(--status-green) !important;
      color: var(--status-green-text) !important;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px var(--status-green-hover);
    }
    tr.row-accent-green:hover td { background: var(--status-green-hover) !important; }

    tr.detail-row td { background: var(--surface2); padding: 10px 16px; }
    tr.setup-row.row-accent-green + tr.detail-row td { box-shadow: inset 3px 0 0 var(--status-green); }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .detail-field .detail-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .detail-field .detail-value { font-size: 0.92rem; font-weight: 600; margin-top: 2px; }
    .detail-empty { color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <h1>Kairos Signals</h1>
      <div class="subtitle">What to watch, and what to do about it.</div>
    </header>

    <div class="api-band" id="apiBand">
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Paste X-API-Key" />
      <button type="button" onclick="submitApiKey()">Connect</button>
    </div>

    <div class="freshness-bar" id="freshnessBar" style="display:none;"></div>

    <main id="mainContent">
      <div class="progress-row" id="signalsCount" hidden></div>
      <div class="status-line" id="statusLine">Loading signals&hellip;</div>
      <div class="status-line" id="emptyState" hidden>Nothing to show right now.</div>
      <div class="auth-required-panel" id="authPanel" hidden></div>
      <div class="dash-table-wrap" id="dashTableWrap" hidden>
        <table class="dash-table">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Trade</th>
              <th>Status</th>
              <th>Next Step</th>
            </tr>
          </thead>
          <tbody id="signalsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/static/signals.js?v=20260906-dashboard-sprint3"></script>
</body>
</html>
