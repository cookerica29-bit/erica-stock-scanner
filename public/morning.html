<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning Watchlist</title>
<style>
  :root {
    --bg: #080d14;
    --surface: #0d1520;
    --surface2: #121d2b;
    --surface3: #172437;
    --border: rgba(142, 163, 185, 0.22);
    --text: #e8eef6;
    --muted: #8ea0b5;
    --accent: #38bdf8;
    --accent2: #22c55e;
    --fail: #fb7185;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a, button { color: inherit; font: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .nav-link { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 0.85rem; }
  .nav-link:hover { border-color: rgba(56, 189, 248, 0.55); background: var(--surface3); }
  .kairos-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .kairos-nav .nav-link.active { border-color: var(--accent); color: var(--accent); background: var(--surface3); font-weight: 600; }

  .status-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 0 10px; color: var(--muted); font-size: 0.85rem; flex-wrap: wrap; }
  button.refresh { border: 1px solid var(--border); background: var(--surface2); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button.refresh:hover { border-color: rgba(56, 189, 248, 0.55); background: var(--surface3); }
  button.refresh:disabled { opacity: 0.5; cursor: default; }

  .section-title { display: flex; align-items: center; gap: 8px; margin: 28px 0 12px; font-size: 1rem; }
  .section-title .count { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.aligned { background: var(--accent2); }
  .dot.reversal { background: var(--warn); }
  .dot.spotlight { background: var(--fail); }
  .dot.sweep { background: var(--accent); }
  .relvol-cell { font-weight: 700; }
  .experimental-badge {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.1);
    border-radius: 999px; padding: 2px 8px;
  }
  .status-pill { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .status-pill.confirmed { background: rgba(34, 197, 94, 0.15); color: var(--accent2); }
  .status-pill.forming { background: rgba(142, 163, 185, 0.15); color: var(--muted); }

  .wl-table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.wl-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.wl-table th { text-align: left; padding: 8px 12px; font-weight: 600; color: var(--muted); background: var(--surface2); white-space: nowrap; }
  table.wl-table th.num, table.wl-table td.num { text-align: right; }
  table.wl-table td { padding: 8px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
  table.wl-table tbody tr.main-row { cursor: pointer; }
  table.wl-table tbody tr.main-row:hover { background: var(--surface2); }
  table.wl-table td.ticker-cell { font-weight: 700; letter-spacing: 0.02em; }
  .bias { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .bias.LONG { background: rgba(34, 197, 94, 0.15); color: var(--accent2); }
  .bias.SHORT { background: rgba(251, 113, 133, 0.15); color: var(--fail); }
  .muted-cell { color: var(--muted); }
  .chevron { display: inline-block; color: var(--muted); transition: transform 0.15s; margin-right: 4px; }
  tr.main-row.expanded .chevron { transform: rotate(90deg); }
  tr.detail-row { display: none; }
  tr.detail-row.expanded { display: table-row; }
  tr.detail-row td { border-top: none; padding: 0 12px 12px 12px; color: var(--text); font-size: 0.85rem; line-height: 1.45; background: var(--surface2); white-space: normal; }
  @media (max-width: 700px) { .wl-table-wrap { overflow-x: auto; } table.wl-table { min-width: 640px; } }

  .empty-state { color: var(--muted); font-size: 0.9rem; padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .status-line { color: var(--muted); font-size: 0.9rem; margin: 20px 0; }
  .status-line.error { color: var(--fail); }

  .errors-panel {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px;
    background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.35);
    font-size: 0.82rem;
  }
  .errors-panel summary { cursor: pointer; color: var(--warn); font-weight: 600; }
  .errors-panel ul { margin: 8px 0 0; padding-left: 18px; color: var(--text); }
  .errors-panel li { margin-bottom: 3px; }
  .errors-panel .err-reason { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Morning Watchlist</h1>
      <div class="subtitle">200SMA bias + daily/4H SMC structure &mdash; where to look today, not what to trade.</div>
    </div>
  </header>
  <nav class="kairos-nav" aria-label="Kairos navigation">
    <a class="nav-link" href="/candidates">Candidates Dashboard</a>
    <a class="nav-link" href="/review-queue">Review Queue</a>
    <a class="nav-link" href="/approved-setups">Approved Setups</a>
    <a class="nav-link" href="/watch-setups">Watch Setups</a>
    <a class="nav-link" href="/dashboard">Dashboard</a>
    <a class="nav-link active" href="/morning" aria-current="page">Morning Watchlist</a>
  </nav>

  <div class="status-bar">
    <span id="statusText">Loading&hellip;</span>
    <button class="refresh" id="refreshBtn" type="button" onclick="loadWatchlist()">Refresh</button>
  </div>

  <div id="content"></div>
</div>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function fmtLevel(value) {
  return (value === null || value === undefined) ? '&mdash;' : ('$' + Number(value).toFixed(2));
}

let rowSeq = 0;

function renderRow(row) {
  const id = 'row' + (rowSeq++);
  return `
    <tr class="main-row" id="${id}" onclick="toggleRow('${id}')">
      <td><span class="chevron">&#9656;</span><span class="ticker-cell">${escapeHtml(row.ticker)}</span></td>
      <td><span class="bias ${escapeHtml(row.bias)}">${escapeHtml(row.bias)}</span></td>
      <td class="num">$${Number(row.price).toFixed(2)}</td>
      <td class="num muted-cell">$${Number(row.sma200_daily).toFixed(2)}</td>
      <td class="muted-cell">${escapeHtml(row.daily_trend)} / ${escapeHtml(row.h4_trend)}</td>
      <td class="num muted-cell">${fmtLevel(row.h4_bos_level)}</td>
      <td class="num muted-cell">${fmtLevel(row.h4_ob_low)}&ndash;${fmtLevel(row.h4_ob_high)}</td>
    </tr>
    <tr class="detail-row" id="${id}-detail"><td colspan="7">${escapeHtml(row.reason)}</td></tr>
  `;
}

function toggleRow(id) {
  document.getElementById(id).classList.toggle('expanded');
  document.getElementById(id + '-detail').classList.toggle('expanded');
}

function renderSpotlightRow(row) {
  const id = 'row' + (rowSeq++);
  return `
    <tr class="main-row" id="${id}" onclick="toggleRow('${id}')">
      <td><span class="chevron">&#9656;</span><span class="ticker-cell">${escapeHtml(row.ticker)}</span></td>
      <td><span class="bias ${escapeHtml(row.bias)}">${escapeHtml(row.bias)}</span></td>
      <td class="num">$${Number(row.price).toFixed(2)}</td>
      <td class="num relvol-cell">${row.relative_volume_today.toFixed(2)}&times;</td>
      <td class="muted-cell">${row.bucket === 'aligned' ? 'Aligned' : 'Watch — early reversal'}</td>
    </tr>
    <tr class="detail-row" id="${id}-detail"><td colspan="5">${escapeHtml(row.reason)}</td></tr>
  `;
}

function renderSpotlightSection(rows) {
  const count = rows.length;
  if (!count) {
    return `<div class="section-title"><span class="dot spotlight"></span> Spotlight — elevated volume today <span class="count">(0)</span></div><div class="empty-state">Nothing showing unusual volume right now.</div>`;
  }
  return `
    <div class="section-title"><span class="dot spotlight"></span> Spotlight — elevated volume today <span class="count">(${count})</span></div>
    <div class="wl-table-wrap">
      <table class="wl-table">
        <thead><tr><th>Ticker</th><th>Bias</th><th class="num">Price</th><th class="num">Rel vol (so far today)</th><th>From</th></tr></thead>
        <tbody>${rows.map(renderSpotlightRow).join('')}</tbody>
      </table>
    </div>
  `;
}

function renderSweepRow(row) {
  const id = 'row' + (rowSeq++);
  return `
    <tr class="main-row" id="${id}" onclick="toggleRow('${id}')">
      <td><span class="chevron">&#9656;</span><span class="ticker-cell">${escapeHtml(row.ticker)}</span></td>
      <td><span class="bias ${row.direction === 'bullish' ? 'LONG' : 'SHORT'}">${row.direction.toUpperCase()}</span></td>
      <td class="num">$${Number(row.price).toFixed(2)}</td>
      <td class="num muted-cell">$${Number(row.level).toFixed(2)}</td>
      <td class="num muted-cell">${Number(row.distance_atr).toFixed(2)} ATR</td>
      <td><span class="status-pill ${escapeHtml(row.status)}">${row.status === 'confirmed' ? 'Confirmed' : 'Forming'}</span></td>
    </tr>
    <tr class="detail-row" id="${id}-detail"><td colspan="6">${escapeHtml(row.reason)}</td></tr>
  `;
}

function renderSweepSection(rows) {
  const count = rows.length;
  const header = `<div class="section-title"><span class="dot sweep"></span> Liquidity Sweeps <span class="experimental-badge">Experimental</span> <span class="count">(${count})</span></div>`;
  const caption = `<div class="subtitle" style="margin: -6px 0 12px;">A real equal-highs/equal-lows level was swept in the last few 4H bars and price hasn't run far since. New today, not yet proven over multiple mornings — watch it, don't trust it blindly.</div>`;
  if (!count) {
    return header + caption + `<div class="empty-state">No fresh liquidity sweeps right now.</div>`;
  }
  return `
    ${header}${caption}
    <div class="wl-table-wrap">
      <table class="wl-table">
        <thead><tr><th>Ticker</th><th>Direction</th><th class="num">Price</th><th class="num">Swept level</th><th class="num">Distance</th><th>Status</th></tr></thead>
        <tbody>${rows.map(renderSweepRow).join('')}</tbody>
      </table>
    </div>
  `;
}

function renderSection(title, dotClass, rows) {
  const count = rows.length;
  if (!count) {
    return `<div class="section-title"><span class="dot ${dotClass}"></span> ${title} <span class="count">(0)</span></div><div class="empty-state">Nothing here right now.</div>`;
  }
  return `
    <div class="section-title"><span class="dot ${dotClass}"></span> ${title} <span class="count">(${count})</span></div>
    <div class="wl-table-wrap">
      <table class="wl-table">
        <thead><tr><th>Ticker</th><th>Bias</th><th class="num">Price</th><th class="num">200SMA</th><th>Daily / 4H</th><th class="num">4H BOS</th><th class="num">4H OB range</th></tr></thead>
        <tbody>${rows.map(renderRow).join('')}</tbody>
      </table>
    </div>
  `;
}

const REASON_LABELS = {
  no_data: 'no data at all',
  no_daily_data: 'daily data failed',
  no_4h_data: '4H data failed',
  processing_error: 'processing error',
};

function renderErrors(errors) {
  if (!errors || !errors.length) return '';
  const items = errors.map(e => `<li><strong>${escapeHtml(e.ticker)}</strong> &mdash; ${escapeHtml(REASON_LABELS[e.reason] || e.reason || 'failed')} <span class="err-reason">(${escapeHtml(e.detail || '')})</span></li>`).join('');
  return `
    <details class="errors-panel">
      <summary>${errors.length} ticker(s) failed to fetch &mdash; not silently missing, click to see which</summary>
      <ul>${items}</ul>
    </details>
  `;
}

async function loadWatchlist() {
  const statusText = document.getElementById('statusText');
  const refreshBtn = document.getElementById('refreshBtn');
  const content = document.getElementById('content');
  refreshBtn.disabled = true;
  statusText.textContent = 'Scanning watchlist… (this can take a little while on a cold cache)';
  content.innerHTML = '';
  try {
    const res = await fetch('/api/watchlist/morning');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const generated = new Date(data.generated_at);
    statusText.textContent = `Scanned ${data.scanned_count} tickers · generated ${generated.toLocaleTimeString()}`;
    content.innerHTML =
      renderSpotlightSection(data.spotlight || []) +
      renderSweepSection(data.liquidity_sweeps || []) +
      renderErrors(data.errors || []) +
      renderSection('Aligned', 'aligned', data.aligned || []) +
      renderSection('Watch — early reversal', 'reversal', data.watch_reversal || []);
  } catch (err) {
    statusText.textContent = 'Failed to load.';
    content.innerHTML = `<div class="status-line error">Error: ${escapeHtml(err.message)}</div>`;
  } finally {
    refreshBtn.disabled = false;
  }
}

loadWatchlist();
</script>
</body>
</html>
